<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 290 160" width="290" height="160" role="img" aria-labelledby="t">
  <title id="t">Tooling: Git, GitHub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1527"/>
      <stop offset="1" stop-color="#070d1a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7ff5ec"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="280" height="150" rx="12"/></clipPath>
  </defs>
  <style>
    .s { font-family: 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,Roboto,Arial,sans-serif; }
    .m { font-family: 'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .item { font-size: 19px; font-weight: 600; fill: #eef4ff; animation: in .8s cubic-bezier(.22,1,.36,1) both; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } }
    .draw { fill: none; stroke: #2ee6d6; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
            animation: draw 1.3s ease both; }
    @keyframes draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
    .beam { transform: translateX(-90px); animation: beam 7s cubic-bezier(.45,0,.55,1) 3.95s infinite; }
    @keyframes beam { 0% { transform: translateX(-90px); } 30%, 100% { transform: translateX(290px); } }
    @media (prefers-reduced-motion: reduce) { .item, .draw { animation: none; } .beam { display: none; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="280" height="150" fill="url(#bg)"/>
    <rect class="beam" x="0" y="0" width="90" height="1.6" fill="url(#beam)"/>
    <text x="22" y="34" class="m" font-size="11" fill="#2ee6d6">06</text>
    <text x="44" y="34" class="m" font-size="11" letter-spacing=".16em" fill="#8fa6c8">TOOLING</text>
    <g transform="translate(228 18)">
      <path d="M8 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM8 21a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM23 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" pathLength="1" class="draw" style="animation-delay:0.75s"/>
      <path d="M8 9v12M23 15c0 4.5-6 4-12.6 7.6" pathLength="1" class="draw" style="animation-delay:0.93s"/>
    </g>
    <text x="22" y="80" class="s item" style="animation-delay:0.70s">Git</text>
    <text x="22" y="107" class="s item" style="animation-delay:0.78s">GitHub</text>
  </g>
  <rect x=".5" y=".5" width="279" height="149" rx="11.5" fill="none" stroke="#1a2840"/>
</svg>
